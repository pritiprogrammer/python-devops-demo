
replicaCount: 1

image:
  repository: priti081294/python-devops-demo
  pullPolicy: IfNotPresent
  tag: "v1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}
service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
   
  hosts:
    - host: python-devops-demo.test.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
   
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: http
   
  hostnames:
  - python-devops-demo.test.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  

resources: {}
livenessProbe:
  httpGet:
    path: /api/v1/info
    port: http
readinessProbe:
  httpGet:
    path: /api/v1/info
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
 
volumeMounts: []
  
nodeSelector: {}

tolerations: []

affinity: {}
